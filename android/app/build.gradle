plugins {
    id "com.android.application"
}

// O APK continua compilando sem google-services.json.
// Nesse caso, apenas as notificações Firebase ficam desativadas.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def defaultServerUrl = "https://tw-store-application.up.railway.app"
def configuredServerUrl = System.getenv("TW_STORE_SERVER_URL")
        ?: (localProperties.getProperty("TW_STORE_SERVER_URL") ?: (project.findProperty("TW_STORE_SERVER_URL") ?: defaultServerUrl))
def escapedServerUrl = configuredServerUrl.replace("\\", "\\\\").replace('"', '\\"')

android {
    namespace "com.twstore.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.twstore.mobile"
        minSdk 24
        targetSdk 35
        versionCode 212
        versionName "2.1.2"
        buildConfigField "String", "TW_STORE_SERVER_URL", "\"${escapedServerUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:34.16.0")
    implementation "com.google.firebase:firebase-messaging"
}
