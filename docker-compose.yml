services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hype_equipe
      POSTGRES_USER: hype
      POSTGRES_PASSWORD: hype_dev
    ports:
      - "5432:5432"
    volumes:
      - hype_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hype -d hype_equipe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hype_postgres:
